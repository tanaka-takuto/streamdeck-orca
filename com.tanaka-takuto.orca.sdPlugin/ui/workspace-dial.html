<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orca ワークスペース</title>
    <link rel="stylesheet" href="workspace-status.css" />
    <script src="workspace-dial.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">ORCA / WORKSPACE</p>
      <h1 id="heading">コマンドの対象を選ぶ</h1>
      <p id="description" class="description">同じ操作 ID のコマンド・AI指示キーや並列変更レーダーの対象を選びます。状態ボタンの割当は独立しています。</p>
      <form id="control-form">
        <label for="control-id">操作 ID</label>
        <div class="control-row">
          <input id="control-id" type="text" value="main" placeholder="例: main、左上、作業 A" autocomplete="off" disabled />
          <button id="apply" type="submit" disabled>保存</button>
        </div>
      </form>
      <p class="hint">同じ ID は同じ選択を共有します。別々に操作したい場合は ID を分けてください。</p>
      <section class="selection" aria-label="現在の表示対象">
        <p class="selection-label">現在のワークスペース</p>
        <p id="workspace-name">取得しています…</p>
        <p id="workspace-identity" class="identity">対象情報を取得しています…</p>
        <p id="workspace-status"></p>
      </section>
      <div class="connection">
        <p id="message" role="status" aria-live="polite">Stream Deck に接続しています…</p>
        <button id="refresh" type="button" disabled>状態を更新</button>
      </div>
      <section class="legend" aria-label="キーの表示">
        <span><i class="working"></i>進行中</span>
        <span><i class="waiting"></i>入力待ち</span>
        <span><i class="review"></i>返答あり・要確認</span>
        <span><i class="idle"></i>待機</span>
        <span><i class="unknown"></i>状態不明</span>
      </section>
      <p class="note">「返答あり」は AI の返答が終了した状態です。内容の確認や、文章で聞かれた質問への回答が残っている場合があります。</p>
    </main>
  </body>
</html>
