<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orca コマンド・AI指示</title>
    <link rel="stylesheet" href="workspace-status.css" />
    <link rel="stylesheet" href="workspace-command.css" />
    <script src="workspace-command.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">ORCA / ACTION</p>
      <h1>コマンド・AI指示</h1>
      <p class="description">同じ操作 ID で選んだワークスペースに対して、実機のキーを押したときに実行します。</p>
      <form id="command-form">
        <label for="control-id">操作 ID</label>
        <input id="control-id" type="text" value="main" autocomplete="off" disabled />
        <label for="mode">実行モード</label>
        <select id="mode" disabled>
          <option value="shell">シェルコマンド</option>
          <option value="ai">AIへの指示</option>
        </select>
        <label for="label">ボタンの表示名</label>
        <input id="label" type="text" placeholder="例: テスト、レビュー" maxlength="40" disabled />
        <label for="body" id="body-label">実行するコマンド</label>
        <textarea id="body" rows="6" maxlength="16000" spellcheck="false" placeholder="例: npm test" disabled></textarea>
        <div id="shell-options">
          <label class="checkbox-row" for="close-on-exit"><input id="close-on-exit" type="checkbox" disabled />終了時にターミナルを閉じる（成功・失敗とも）</label>
          <label class="checkbox-row" for="close-on-success"><input id="close-on-success" type="checkbox" disabled />正常終了時だけターミナルを閉じる</label>
          <p class="hint">両方オンの場合は終了結果にかかわらず閉じます。どちらもオフなら残します。</p>
        </div>
        <div id="agent-panel" hidden>
          <label for="agent-target">AIの送信先</label>
          <select id="agent-target" disabled><option value="auto">AIが1つなら自動選択</option></select>
          <p id="agent-help" class="hint">送信先はワークスペースごとに保存します。</p>
        </div>
        <p id="mode-help" class="hint">コマンドごとに新しい実行用ターミナルを開きます。</p>
        <div class="save-row"><button id="save" type="submit" disabled>保存</button></div>
      </form>
      <section class="selection" aria-label="現在の実行先">
        <p class="selection-label">現在のワークスペース</p>
        <p id="workspace-name">取得しています…</p>
        <p id="workspace-status"></p>
      </section>
      <div class="connection">
        <p id="message" role="status" aria-live="polite">Stream Deck に接続しています…</p>
        <button id="refresh" type="button" disabled>状態を更新</button>
      </div>
      <section class="selection" aria-label="直近の実行結果">
        <p class="selection-label">直近の実行・送信</p>
        <p id="last-result" role="status">まだ実行していません。</p>
      </section>
      <p class="note">「受付済み」はコマンドや指示の受付を表します。シェルの自動クローズを指定した場合は、終了コードと閉じた結果を直近の実行欄に表示します。</p>
    </main>
  </body>
</html>
