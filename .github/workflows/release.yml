name: Build and release

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test on Node.js ${{ matrix.node }}
        run: npm test
      - name: Check and build
        if: matrix.node == 22
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run validate
      - name: Set release build version
        if: matrix.node == 22
        run: node scripts/release.mjs prepare
      - name: Pack and verify final files
        if: matrix.node == 22
        run: |
          npm run pack
          npm exec -- biome format --write com.tanaka-takuto.orca.sdPlugin/manifest.json
          zip -q dist/com.tanaka-takuto.orca.streamDeckPlugin com.tanaka-takuto.orca.sdPlugin/manifest.json
          node scripts/release.mjs verify
          npm run lint
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.node == 22
        with:
          name: installer-${{ github.run_id }}
          path: |
            dist/*.streamDeckPlugin
            dist/SHA256SUMS
            dist/release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: installer-${{ github.run_id }}
          path: dist
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
